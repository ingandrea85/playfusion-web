<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Organizer · Categorie</title>
  <link rel="stylesheet" href="/shared/tokens.css" /><link rel="stylesheet" href="/shared/ui.css" />
</head>
<body>
  <header id="shell"></header>
  <main class="pf-container pf-container--narrow">
    <div class="pf-pagehead">
      <div class="pf-eyebrow">Setup · Categorie</div>
      <h1>Categorie</h1>
    </div>
    <div class="pf-card">
      <ul class="pf-catlist" id="list" style="margin-bottom:var(--space-5)"></ul>
      <form id="form">
        <div class="pf-row" style="align-items:flex-end">
          <div class="pf-field" style="flex:1;margin-bottom:0"><label>Nome categoria</label><input name="name" placeholder="Es. U16" required /></div>
          <div class="pf-field" style="width:130px;margin-bottom:0"><label>Max squadre</label><input name="maxTeams" type="number" min="2" value="8" required /></div>
          <button class="pf-btn pf-btn--primary" type="submit">Aggiungi</button>
        </div>
      </form>
    </div>
  </main>
  <script type="module" src="./categories.ts"></script>
</body>
</html>
