name: Deploy tag → collaudo

# A pushed `stg-*` tag synth+deploys the collaudo (stg) environment. The trigger is
# tags-only (like deploy-prod's `v*`), so a plain push/merge to `stage` deploys nothing;
# a guard asserts the tagged commit is reachable from `stage` (stg tags are cut from it).
# `stg-*` never matches prod's `v*`, so a stage tag never triggers the prod workflow.
# Credentials via GitHub→AWS OIDC (S0.13); no long-lived keys. Deploy-role ARN comes from
# the repo variable AWS_DEPLOY_ROLE_ARN.

on:
  push:
    tags: ['stg-*']

concurrency:
  group: deploy-stg
  cancel-in-progress: false

permissions:
  id-token: write # OIDC
  contents: read

env:
  PF_ENV: stg
  AWS_REGION: eu-south-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cdk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need stage to verify the tag is cut from it

      - name: Guard — tag must be on stage
        working-directory: .
        run: |
          set -euo pipefail
          if ! git branch -r --contains "${{ github.sha }}" | grep -qE 'origin/stage$'; then
            echo "::error::Tag ${{ github.ref_name }} is not on stage — refusing to deploy collaudo."
            exit 1
          fi
          echo "Tag ${{ github.ref_name }} is on stage ✓"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci
        working-directory: .

      - name: Build backend (platform-lib for Lambda bundling)
        run: npm run build -w @playfusion/platform-lib
        working-directory: .

      # HostingStack's BucketDeployment (infra/cdk/lib/hosting-stack.ts) reads each app's
      # built dist/ via Source.asset at synth time — it must exist before synth/deploy.
      - name: Build frontend apps (E1/E3, needed by HostingStack at synth time)
        run: npm run build -w @playfusion/e1-web -w @playfusion/e3-web
        working-directory: .

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK synth (env=stg)
        run: npx cdk synth -c env=stg

      - name: CDK deploy (env=stg)
        run: npx cdk deploy --all -c env=stg --require-approval never
